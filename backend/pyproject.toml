[project]
name = "finance-app"
version = "0.1.0"
description = "Distributed Personal Finance System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi[all]>=0.110.0"]

[project.scripts]
finance = "finance.__main__:main"

[dependency-groups]
dev = [
  "pytest==8.1.1",
  "pyright==1.1.350",
  "ruff==0.15.14",
  "httpx>=0.27.0",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingParameterType = true
reportUnknownParameterType = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
