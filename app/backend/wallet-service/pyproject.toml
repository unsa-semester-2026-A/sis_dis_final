[project]
name = "wallet-service"
version = "0.1.0"
description = "Servicio de billetera y contabilidad distribuida"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "pyright==1.1.350",
    "ruff==0.15.14",
    "httpx==0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["app"]
pythonpath = ["."]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
reportMissingParameterType = true
reportUnknownParameterType = true

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D"]
