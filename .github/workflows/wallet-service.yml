name: Wallet Service CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'build/**'
    paths:
      - 'wallet-service/**'
      - '.github/workflows/wallet-service.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./wallet-service
          file: ./wallet-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/wallet-app:latest
            ghcr.io/${{ env.OWNER_LC }}/wallet-app:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: pacocha-az
          containerAppName: wallet-app
          imageToDeploy: ghcr.io/${{ env.OWNER_LC }}/wallet-app:${{ github.sha }}
